# ===========================================================================
# Dockge for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : louislam/dockge:1.5.0 (Docker Hub, used unmodified)
#                  -> https://github.com/louislam/dockge
#
# Ports   : host 8004 -> container 5001. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/dockgedocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
#
# EXCEPTION - Docker socket (approved deviation, see docs/DESIGN_DECISIONS.md
# and docs/SOCKET-EXEMPTION.md). This application *is* a Docker control
# panel: every feature it has (list stacks, start/stop, compose up/down,
# logs, terminal) is a Docker Engine API call over /var/run/docker.sock.
# Without the socket the container starts but cannot do anything, so the
# image would have to be forked - which the rules forbid.
#
# Least privilege actually applied:
#   * the container still runs as an unprivileged user (uid 1000), never root;
#   * only the socket file is bind-mounted - never /var/run, never the
#     Docker data root, never an extra capability, never privileged mode;
#   * group_add: ["0"] is required only because the TOS socket is
#     srw-rw---- root:root 0660 - a non-root process cannot open it
#     otherwise (measured on hardware, see the exemption document);
#   * reachability is limited to the Docker API this panel needs.
# Justification: Dockge is a Docker Compose stack manager: listing stacks, starting/stopping them, compose up/down, logs and the container terminal are all Docker Engine API calls over /var/run/docker.sock, so the socket is the application's core function rather than an optional privilege. The container therefore runs unprivileged (user 1000:1000), adds no capability, uses no privileged mode and no host networking, and mounts only the socket file itself; group_add 0 exists because the TOS socket is root:root 0660 and a non-root process cannot open it otherwise (measured on hardware). The only host path the application writes is its own data directory.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  dockgedocker:
    image: louislam/dockge:1.5.0
    container_name: dockgedocker
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "0"
    ports:
      - "8004:5001"
    environment:
      TZ: "Asia/Shanghai"
      DOCKGE_STACKS_DIR: "/Volume1/DockerAppData/dockgedocker/stacks"
    volumes:
      - /Volume1/DockerAppData/dockgedocker/app_data:/app/data
      - /Volume1/DockerAppData/dockgedocker/stacks:/Volume1/DockerAppData/dockgedocker/stacks
      -
        type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:5001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8004
    protocol: http
